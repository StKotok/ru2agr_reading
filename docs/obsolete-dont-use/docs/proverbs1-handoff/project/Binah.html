const THEMES = {

const THEMES_ARR = Object.values(THEMES);

/* ═══════════════════════════ TWEAK DEFAULTS ═══════════════════════════ */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "chtets",
  "fontSize": 17,
  "showRu": true,
  "showTr": true,
  "showHe": true
}/*EDITMODE-END*/;

/* ═══════════════════════════ APP ═══════════════════════════ */

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [chapter, setChapter] = useState(1);
  const [view, setView] = useState('gallery');
  const [activeChar, setActiveChar] = useState(null);
  const [mobileTab, setMobileTab] = useState('text');
  const [isMobile, setIsMobile] = useState(() => window.innerWidth < 680);

  const t = THEMES[tw.theme] || THEMES.svitok;
  const fontSize = tw.fontSize;

  useEffect(() => {
    const h = () => setIsMobile(window.innerWidth < 680);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);

  const openChar = id => {
    setActiveChar(id);
    setView('detail');
    if (isMobile) setMobileTab('chars');
  };
  const openGallery = () => { setView('gallery'); setActiveChar(null); };

  const vars = {
    '--bg': t.bg, '--bg-card': t.bgCard, '--bg-surf': t.bgSurf,
    '--bdr': t.bdr, '--txt': t.txt, '--mut': t.mut,
    '--acc': t.acc, '--acc-bg': t.accBg,
    '--f-body': t.fBody, '--f-ui': t.fUI, '--f-he': t.fHe,
    '--r': t.r,
  };

  const mainContent = (
    <>
      <TextPane t={t} paras={CH1} showRu={tw.showRu} showTr={tw.showTr} showHe={tw.showHe}
        activeChar={activeChar} onWord={openChar} fontSize={fontSize} />
      <CharPanel t={t} view={view} activeChar={activeChar}
        onGallery={openGallery} onChar={openChar} />
    </>
  );

  const mobileContent = (
    <>
      <div style={{ flex:1, overflow:'hidden', display: mobileTab==='text'?'flex':'none', flexDirection:'column' }}>
        <TextPane t={t} paras={CH1} showRu={tw.showRu} showTr={tw.showTr} showHe={tw.showHe}
          activeChar={activeChar} onWord={id => { openChar(id); setMobileTab('chars'); }} fontSize={fontSize} />
      </div>
      <div style={{ flex:1, overflow:'hidden', display: mobileTab==='chars'?'flex':'none', flexDirection:'column' }}>
        <CharPanel t={t} view={view} activeChar={activeChar}
          onGallery={openGallery} onChar={openChar} mobile />
      </div>
      <MobileTabs t={t} tab={mobileTab} setTab={setMobileTab} />
    </>
  );

  return (
    <div style={{ ...vars, background:t.bg, color:t.txt, fontFamily:t.fUI,
      height:'100dvh', display:'flex', flexDirection:'column', overflow:'hidden' }}>
      <Header t={t} />
      <Toolbar t={t} chapter={chapter} setChapter={setChapter}
        showRu={tw.showRu} setShowRu={v => setTweak('showRu', v)}
        showTr={tw.showTr} setShowTr={v => setTweak('showTr', v)}
        showHe={tw.showHe} setShowHe={v => setTweak('showHe', v)} />
      <div style={{ flex:1, display:'flex', overflow:'hidden',
        flexDirection: isMobile ? 'column' : 'row',
        borderTop:`1px solid ${t.bdr}` }}>
        {isMobile ? mobileContent : mainContent}
      </div>

      <TweaksPanel>
        <TweakSection label="Тема дизайна" />
        <ThemePicker t={t} value={tw.theme} onChange={v => setTweak('theme', v)} />
        <TweakSection label="Текст" />
        <TweakSlider label="Размер шрифта" value={fontSize} min={14} max={21} unit="px"
          onChange={v => setTweak('fontSize', v)} />
        <TweakSection label="Разметка" />
        <TweakToggle label="Русские метки (Ру)" value={tw.showRu}
          onChange={v => setTweak('showRu', v)} />
        <TweakToggle label="Транслитерация (Tr)" value={tw.showTr}
          onChange={v => setTweak('showTr', v)} />
        <TweakToggle label="Иврит (+א)" value={tw.showHe}
          onChange={v => setTweak('showHe', v)} />
      </TweaksPanel>
    </div>
  );
}

/* ═══ THEME PICKER (custom control for TweaksPanel) ═══ */
function ThemePicker({ t, value, onChange }) {
  return (
    <div style={{ padding:'4px 14px 10px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:'6px' }}>
      {THEMES_ARR.map(th => (
        <button key={th.id} onClick={() => onChange(th.id)} style={{
          padding:'8px 10px', borderRadius:'8px', border:`1.5px solid ${value===th.id ? t.acc : 'rgba(0,0,0,0.1)'}`,
          background: value===th.id ? t.accBg : th.bg,
          cursor:'pointer', textAlign:'left', transition:'all .15s',
        }}>
          <div style={{ fontFamily:t.fUI, fontSize:'12px', fontWeight:600,
            color: value===th.id ? t.acc : '#2d2416' }}>{th.name}</div>
          <div style={{ fontFamily:t.fUI, fontSize:'10px', color:'#888', marginTop:'1px' }}>{th.desc}</div>
        </button>
      ))}
    </div>
  );
}

/* ═══ HEADER ═══ */
function Header({ t }) {
  return (
    <header style={{ background:t.hBg, borderBottom:`1px solid ${t.barBdr}`,
      padding:'0 20px', height:'52px', display:'flex', alignItems:'center', gap:'10px', flexShrink:0 }}>
      <span style={{ fontFamily:t.fBody, fontWeight:700, fontSize:'22px',
        letterSpacing:'-0.5px', color:t.txt }}>Binah</span>
      <span style={{ color:t.mut, fontSize:'13px', fontFamily:t.fUI }}>
        Исследуй сокровища книги Притч
      </span>
      <div style={{ marginLeft:'auto' }}>
        <button style={{ background:'none', border:`1px solid ${t.bdr}`, borderRadius:'50%',
          width:'30px', height:'30px', cursor:'pointer', color:t.mut, fontSize:'15px',
          display:'flex', alignItems:'center', justifyContent:'center',
          fontFamily:'serif', transition:'all .15s' }}>ⓘ</button>
      </div>
    </header>
  );
}

/* ═══ TOOLBAR ═══ */
function Toolbar({ t, chapter, setChapter, showRu, setShowRu, showTr, setShowTr, showHe, setShowHe }) {
  const selectStyle = {
    fontFamily:t.fUI, fontSize:'13px', fontWeight:500,
    height:'32px', padding:'0 26px 0 12px', border:`1px solid ${t.bdr}`,
    cursor:'pointer', transition:'all .15s', borderRadius:t.r,
    background:t.bgCard, color:t.mut,
  };

  const segs = [
    { label:'Ру',  active:showRu, toggle:() => setShowRu(!showRu),  title:'Русское слово' },
    { label:'Tr',  active:showTr, toggle:() => setShowTr(!showTr),  title:'Транслитерация' },
    { label:'+א', active:showHe, toggle:() => setShowHe(!showHe), title:'Иврит' },
  ];

  return (
    <div style={{ background:t.barBg, borderBottom:`1px solid ${t.barBdr}`,
      padding:'0 20px', height:'50px', display:'flex', alignItems:'center',
      gap:'10px', flexShrink:0 }}>
      <div style={{ position:'relative' }}>
        <select value={chapter} onChange={e => setChapter(+e.target.value)} style={selectStyle}>
          {Array.from({length:31},(_,i) =>
            <option key={i+1} value={i+1}>Гл. {i+1}</option>)}
        </select>
        <span style={{ position:'absolute', right:'8px', top:'50%', transform:'translateY(-50%)',
          pointerEvents:'none', fontSize:'9px', color:t.mut }}>▼</span>
      </div>
      <div style={{ width:'1px', height:'20px', background:t.bdr }} />
      {/* Connected 3-part toggle */}
      <div style={{ display:'flex', border:`1px solid ${t.bdr}`, borderRadius:t.r, overflow:'hidden' }}>
        {segs.map(({ label, active, toggle, title }, i) => (
          <button key={label} onClick={toggle} title={title} style={{
            padding:'0 13px', height:'32px', border:'none',
            borderLeft: i > 0 ? `1px solid ${t.bdr}` : 'none',
            background: active ? t.acc : t.bgCard,
            color: active ? '#fff' : t.mut,
            cursor:'pointer', fontSize:'13px', fontWeight:500,
            fontFamily:t.fUI, transition:'all .15s',
          }}>{label}</button>
        ))}
      </div>
    </div>
  );
}

/* ═══ TEXT PANE ═══ */
function TextPane({ t, paras, showRu, showTr, showHe, activeChar, onWord, fontSize }) {
  return (
    <div style={{ flex:1, overflowY:'auto', padding:'28px 36px 40px',
      fontFamily:t.fBody, fontSize:fontSize+'px', lineHeight:t.lh, color:t.txt }}>
      {paras.map(para => (
        <div key={para.id} style={{ marginBottom:'36px' }}>
          <div style={{ fontFamily:t.fUI, fontSize:'10.5px', fontWeight:600,
            letterSpacing:'0.09em', textTransform:'uppercase', color:t.mut,
            marginBottom:'14px', paddingBottom:'7px', borderBottom:`1px solid ${t.bdr}` }}>
            {para.title}
          </div>
          <p style={{ margin:0 }}>
            {para.vv.map(v => (
              <span key={v.n}>
                <sup style={{ fontSize:'0.55em', color:t.fnt, marginRight:'2px',
                  lineHeight:1, verticalAlign:'super' }}>{v.n}</sup>
                {v.ss.map((seg,si) =>
                  seg.ch
                    ? <Word key={si} t={t} seg={seg} showRu={showRu} showTr={showTr} showHe={showHe}
                        active={activeChar===seg.ch} onClick={() => onWord(seg.ch)} />
                    : <span key={si}>{seg.t}</span>
                )}
              </span>
            ))}
          </p>
        </div>
      ))}
    </div>
  );
}

/* ═══ HIGHLIGHTED WORD ═══ */
function Word({ t, seg, showRu, showTr, showHe, active, onClick }) {
  const [hover, setHover] = useState(false);
  const ch = CHARS[seg.ch];
  const c = ch.c;
  const hot = hover || active;

  let wStyle = { cursor:'pointer', transition:'all .15s', display:'inline', borderRadius:'3px' };
  if (showRu) {
    if (t.hl==='badge') {
      wStyle = { ...wStyle, background: hot ? c.bg : c.bg+'99',
        padding:'1px 3px', borderRadius:'3px' };
    } else if (t.hl==='underline') {
      wStyle = { ...wStyle, borderBottom:`2.5px solid ${hot ? c.mid : c.mid+'88'}`, paddingBottom:'1px' };
    } else if (t.hl==='filled') {
      wStyle = { ...wStyle, background: c.bg,
        padding:'2px 5px', borderRadius:'2px',
        boxShadow: hot ? `0 0 0 1.5px ${c.mid}55` : 'none' };
    } else if (t.hl==='dot') {
      wStyle = { ...wStyle, background: hot ? c.bg+'88' : 'transparent',
        padding: hot ? '1px 3px' : '0', borderRadius:'3px' };
    }
  } else {
    wStyle = { ...wStyle, color: hot ? c.mid : t.txt };
  }

  const badge = (
    <span style={{ display:'inline-block', fontSize:'0.66em', fontFamily:t.fUI, fontWeight:600,
      color:c.drk, background:c.bg, border:`1px solid ${c.mid}55`,
      padding:'0 5px', borderRadius:'9px', marginLeft:'3px',
      lineHeight:'1.6', verticalAlign:'1px', transition:'all .15s',
      opacity: hot ? 1 : 0.82 }}>{seg.tr}</span>
  );

  return (
    <span onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      onClick={onClick} style={{ display:'inline' }}>
      <span style={wStyle}>{seg.t}</span>
      {showTr && (t.hl==='badge' || t.hl==='filled') && badge}
      {showTr && t.hl==='underline' && (hover || active) && badge}
      {showTr && t.hl==='dot' && (
        <span style={{ display:'inline-block', width:'6px', height:'6px',
          borderRadius:'50%', background:c.mid, marginLeft:'3px',
          verticalAlign:'middle', opacity:0.85, flexShrink:0 }} />
      )}
      {showHe && (
        <span style={{ fontFamily:t.fHe, fontSize:'0.78em', color:c.drk,
          marginLeft:'4px', direction:'rtl', display:'inline-block' }}>{ch.he}</span>
      )}
    </span>
  );
}

/* ═══ CHARACTER PANEL ═══ */
function CharPanel({ t, view, activeChar, onGallery, onChar, mobile }) {
  return (
    <aside style={{ width: mobile?'100%':'340px', borderLeft: mobile?'none':`1px solid ${t.bdr}`,
      borderTop: mobile?`1px solid ${t.bdr}`:'none',
      background:t.bgSurf, display:'flex', flexDirection:'column',
      overflow:'hidden', flexShrink:0 }}>
      <div key={view+activeChar} className="anim-slide" style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
        {view==='gallery'
          ? <Gallery t={t} activeChar={activeChar} onChar={onChar} />
          : <Detail t={t} char={CHARS[activeChar]} onGallery={onGallery} />}
      </div>
    </aside>
  );
}

/* ═══ GALLERY ═══ */
function Gallery({ t, activeChar, onChar }) {
  return (
    <div style={{ flex:1, overflowY:'auto', padding:'20px' }}>
      <div style={{ marginBottom:'16px' }}>
        <div style={{ fontFamily:t.fBody, fontWeight:600, fontSize:'17px', color:t.txt }}>
          Галерея персонажей
        </div>
        <div style={{ fontFamily:t.fUI, fontSize:'12px', color:t.mut, marginTop:'3px' }}>
          Нажмите на карточку, чтобы узнать больше
        </div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:'9px' }}>
        {CHARS_ARR.map(ch => (
          <GalleryCard key={ch.id} t={t} ch={ch}
            active={activeChar===ch.id} onClick={() => onChar(ch.id)} />
        ))}
      </div>
    </div>
  );
}

/* ═══ GALLERY CARD ═══ */
function GalleryCard({ t, ch, active, onClick }) {
  const [hover, setHover] = useState(false);
  const hot = hover || active;
  return (
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} onClick={onClick}
      style={{ display:'flex', alignItems:'center', gap:'12px',
        background: hot ? ch.c.lgt : t.bgCard,
        border:`1px solid ${hot ? ch.c.mid+'66' : t.bdr}`,
        borderRadius:t.r, padding:'12px 13px',
        cursor:'pointer', transition:'all .18s ease',
        boxShadow: hot ? `0 2px 10px ${ch.c.mid}20` : 'none' }}>
      <div style={{ width:'50px', height:'50px', background:ch.c.bg,
        borderRadius:t.r, display:'flex', alignItems:'center', justifyContent:'center',
        flexShrink:0, transition:'all .18s' }}>
        <span style={{ fontFamily:t.fHe, fontSize:'25px', color:ch.c.drk, direction:'rtl' }}>{ch.he}</span>
      </div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:'6px', marginBottom:'2px' }}>
          <span style={{ fontFamily:t.fUI, fontWeight:600, fontSize:'13.5px', color:t.txt }}>{ch.ru}</span>
          <span style={{ fontFamily:t.fUI, fontSize:'11px', color:t.mut, fontStyle:'italic' }}>{ch.lat}</span>
        </div>
        <div style={{ fontFamily:t.fBody, fontSize:'12px', color:t.mut, lineHeight:1.4,
          overflow:'hidden', display:'-webkit-box',
          WebkitLineClamp:2, WebkitBoxOrient:'vertical' }}>{ch.short}</div>
        <div style={{ marginTop:'5px', display:'flex', alignItems:'center', gap:'5px' }}>
          <span style={{ width:'7px', height:'7px', borderRadius:'50%',
            background:ch.c.mid, display:'inline-block', flexShrink:0 }} />
          <span style={{ fontFamily:t.fUI, fontSize:'11px', color:t.mut }}>{ch.cnt} упоминаний</span>
        </div>
      </div>
    </div>
  );
}

/* ═══ DETAIL PANEL ═══ */
function Detail({ t, char, onGallery }) {
  if (!char) return null;
  const ch = char;
  const traits = TRAITS[ch.id] || [];

  const bannerStyle = t.hl==='underline'
    ? { background:t.bgCard, border:`1px solid ${ch.c.mid}55`, margin:'12px', borderRadius:t.r,
        padding:'24px 16px', display:'flex', alignItems:'center', justifyContent:'center',
        flexDirection:'column', gap:'8px' }
    : { background:ch.c.bg, padding:'30px 20px',
        display:'flex', alignItems:'center', justifyContent:'center' };

  return (
    <div style={{ flex:1, overflowY:'auto', display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 16px', borderBottom:`1px solid ${t.bdr}`,
        display:'flex', alignItems:'center', flexShrink:0 }}>
        <button onClick={onGallery} style={{ background:t.bgCard, border:`1px solid ${t.bdr}`,
          borderRadius:t.r, padding:'5px 13px', fontSize:'13px', fontFamily:t.fUI,
          color:t.mut, cursor:'pointer', display:'flex', alignItems:'center',
          gap:'5px', transition:'all .15s' }}>← Галерея</button>
      </div>

      <div style={bannerStyle}>
        <span style={{ fontFamily:t.fHe, fontSize:'72px', color:ch.c.drk,
          direction:'rtl', lineHeight:1.15 }}>{ch.he}</span>
        {t.hl==='underline' && (
          <div style={{ width:'40px', height:'3px', background:ch.c.mid, borderRadius:'2px' }} />
        )}
      </div>

      <div style={{ padding:'20px', flex:1 }}>
        <div style={{ marginBottom:'16px' }}>
          <div style={{ fontFamily:t.fUI, fontWeight:700, fontSize:'19px',
            letterSpacing:'-0.2px', color:t.txt, textTransform:'uppercase' }}>
            {ch.ru}
            <span style={{ fontWeight:400, color:t.mut, fontSize:'13px',
              textTransform:'none', marginLeft:'8px' }}>{ch.lat}</span>
          </div>
          <div style={{ display:'flex', alignItems:'baseline', gap:'8px', marginTop:'6px' }}>
            <span style={{ fontFamily:t.fHe, fontSize:'19px', color:ch.c.drk, direction:'rtl' }}>{ch.he}</span>
            <span style={{ fontFamily:t.fUI, fontSize:'14px', color:t.mut }}>{ch.tr}</span>
          </div>
        </div>

        <p style={{ fontFamily:t.fBody, fontSize:'14px', lineHeight:1.72, color:t.txt, marginBottom:'22px' }}>
          {ch.desc}
        </p>

        <div>
          <div style={{ fontFamily:t.fUI, fontSize:'10.5px', fontWeight:600,
            letterSpacing:'0.08em', textTransform:'uppercase', color:t.mut, marginBottom:'10px' }}>
            Ключевые черты
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:'9px' }}>
            {traits.map(([name, desc]) => (
              <div key={name} style={{ display:'flex', gap:'9px', alignItems:'flex-start' }}>
                <span style={{ width:'7px', height:'7px', borderRadius:'50%', background:ch.c.mid,
                  flexShrink:0, marginTop:'5px' }} />
                <div style={{ fontSize:'13px', lineHeight:1.55 }}>
                  <span style={{ fontFamily:t.fUI, fontWeight:600, color:t.txt }}>{name}</span>
                  <span style={{ fontFamily:t.fBody, color:t.mut }}> — {desc}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══ MOBILE TABS ═══ */
function MobileTabs({ t, tab, setTab }) {
  const s = active => ({
    flex:1, padding:'10px 0', fontFamily:t.fUI, fontSize:'13px', fontWeight:500,
    background:'none', border:'none', cursor:'pointer', transition:'all .15s',
    color: active ? t.acc : t.mut,
    borderTop: active ? `2px solid ${t.acc}` : `2px solid transparent`,
  });
  return (
    <div style={{ display:'flex', borderTop:`1px solid ${t.bdr}`, background:t.barBg, flexShrink:0 }}>
      <button style={s(tab==='text')} onClick={() => setTab('text')}>Текст</button>
      <button style={s(tab==='chars')} onClick={() => setTab('chars')}>Персонажи</button>
    </div>
  );
}

/* ═══ MOUNT ═══ */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

      if (q && !w.g.toLowerCase().includes(q) && !w.t.toLowerCase().includes(q)) return false;
      if (v !== 'all' && statusMap[w.k] !== v) return false;
      return true;
    }).length;
  }
  // reusable "В тексте" pieces
  eyePill() {
    const C=this.C, h=React.createElement, st=this.state;
    return h('button',{onClick:()=>this.setState({showInText:!st.showInText}),
      style:{display:'flex',alignItems:'center',gap:6,padding:'8px 13px',borderRadius:10,border:'1px solid '+(st.showInText?this.a(C.terra,.45):C.line),background:st.showInText?C.terraSoft:'transparent',color:st.showInText?C.terra:C.muted,fontFamily:this.sans,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}},
      this.iconEye(st.showInText?C.terra:C.muted),'В тексте');
  }
  /* ---- V3: выпадающий список статусов + чип (самый компактный) ---- */
  sV3() {
    const C=this.C, h=React.createElement, st=this.state;
    const opts = this.sOpts();
    const cur = opts.find(o => o[0] === st.statusFilter) || opts[0];
    const open = st.sMenuOpen;
    const menu = open ? h('div',{style:{position:'absolute',top:'calc(100% + 6px)',left:0,zIndex:50,minWidth:182,background:C.card,border:'1px solid '+C.cardLine,borderRadius:12,boxShadow:'0 16px 38px -12px rgba(40,34,22,.42)',padding:6,animation:'scPop .14s ease'}},
      opts.map(([v,l]) => {
        const on = st.statusFilter === v;
        return h('button',{key:v,onClick:()=>this.setState({statusFilter:v,sMenuOpen:false}),
          style:{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',gap:12,padding:'9px 11px',borderRadius:8,border:'none',background:on?this.a(C.ink,.07):'transparent',color:on?C.ink:C.inkSoft,fontFamily:this.sans,fontSize:13.5,fontWeight:on?700:500,cursor:'pointer',textAlign:'left'}},
          h('span',null,l),
          h('span',{style:{fontFamily:this.sans,fontSize:11.5,fontWeight:600,color:C.muted2}},this.statusCount(v))
        );
      })
    ) : null;
    const dd = h('div',{'data-smenu':'1',style:{position:'relative',flexShrink:0}},
      h('button',{onClick:()=>this.setState({sMenuOpen:!open}),
        style:{display:'flex',alignItems:'center',gap:8,padding:'8px 13px',borderRadius:10,border:'1px solid '+(open?C.line2:C.line),background:C.card,color:C.ink,fontFamily:this.sans,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}},
        h('span',{style:{color:C.muted}},'Статус:'),
        h('span',{style:{fontWeight:700}},cur[1]),
        h('span',{style:{fontFamily:this.sans,fontSize:11.5,fontWeight:600,color:C.muted2}},this.statusCount(st.statusFilter)),
        this.caret(C.muted, open)
      ),
      menu
    );
    return h('div',{style:{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}, dd, this.eyePill());
  }


  /* ---- status bar (phone) ---- */
  statusBar() {
    const C=this.C, h=React.createElement;
    const bars=[5,7,9,11].map((ht,i)=>h('rect',{key:i,x:i*4,y:11-ht,width:2.6,height:ht,rx:0.8,fill:C.ink}));
    const sig=h('svg',{width:17,height:11,viewBox:'0 0 17 11'},...bars);
    const wifi=h('svg',{width:16,height:11,viewBox:'0 0 16 11',fill:'none',stroke:C.ink,strokeWidth:1.4,strokeLinecap:'round'},h('path',{d:'M2 4.2C4 2.6 6 1.8 8 1.8s4 .8 6 2.4'}),h('path',{d:'M4 6.4C5.2 5.4 6.6 5 8 5s2.8.4 4 1.4'}),h('circle',{cx:8,cy:9,r:1,fill:C.ink,stroke:'none'}));
    const batt=h('svg',{width:26,height:12,viewBox:'0 0 26 12'},h('rect',{x:.6,y:.6,width:21,height:10.8,rx:3,fill:'none',stroke:this.a(C.ink,.45),strokeWidth:1.2}),h('rect',{x:2.4,y:2.4,width:16,height:7.2,rx:1.6,fill:C.ink}),h('rect',{x:23,y:3.6,width:2,height:4.8,rx:1,fill:this.a(C.ink,.5)}));
    return h('div',{style:{flex:'0 0 auto',height:46,display:'flex',alignItems:'flex-end',justifyContent:'space-between',padding:'0 26px 7px',fontFamily:this.sans,fontSize:15,fontWeight:600,color:C.ink}},
      h('div',null,'9:41'),
      h('div',{style:{display:'flex',gap:7,alignItems:'center'}},sig,wifi,batt));
  }

  /* ---- toast ---- */
  toastEl(mobile) {
    const C=this.C, h=React.createElement;
    if (!this.state.toast) return null;
    return h('div',{key:'toast',style:{position:'absolute',left:'50%',bottom:mobile?88:22,transform:'translateX(-50%)',zIndex:60,background:this.a('#26221c',.96),color:'#f3eee2',fontFamily:this.sans,fontSize:13,fontWeight:500,padding:'10px 18px',borderRadius:12,maxWidth:290,textAlign:'center',boxShadow:'0 12px 32px -8px rgba(0,0,0,.42)',animation:'scToast .22s ease',whiteSpace:'nowrap'}},this.state.toast);
  }

  /* ---- PHONE app ---- */
  phoneApp() {
    const C=this.C, h=React.createElement, st=this.state;
    const sheet = (st.sheetOpen && st.activeKey) ? h('div',{key:'sheet',style:{position:'absolute',inset:0,zIndex:30}},
      h('div',{onClick:()=>this.closeCard(),style:{position:'absolute',inset:0,background:this.a('#15140f',.28),animation:'scFade .2s ease'}}),
      h('div',{onClick:e=>e.stopPropagation(),style:{position:'absolute',left:0,right:0,bottom:0,maxHeight:'84%',background:C.card,borderRadius:'24px 24px 0 0',boxShadow:'0 -14px 50px -10px rgba(40,34,22,.38)',display:'flex',flexDirection:'column',animation:'scSheetUp .3s cubic-bezier(.22,1,.36,1)'}},
        h('div',{style:{flex:'0 0 auto',display:'flex',justifyContent:'center',paddingTop:10}},h('div',{style:{width:36,height:4,borderRadius:3,background:C.line2}})),
        h('div',{className:'scScroll',style:{overflowY:'auto'}},this.wCard(st.activeKey))
      )
    ) : null;

    return h('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',background:C.content}},
      this.statusBar(),
      // Header
      h('div',{style:{flex:'0 0 auto',padding:'2px 18px 11px',background:C.card,borderBottom:'1px solid '+C.cardLine,boxShadow:'0 6px 18px -14px rgba(40,34,22,.45)',position:'relative',zIndex:5}},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',height:44}},
          h('div',{style:{fontFamily:this.serif,fontSize:24,fontWeight:700,color:C.ink}},'Словарь'),
          h('div',{style:{fontFamily:this.sans,fontSize:12,color:C.muted}},this.getFiltered().length+'\u00a0слов')
        ),
        h('div',{style:{marginBottom:9}},this.searchBar(true)),
        this.sV3(),
        h('div',{style:{height:8}}),
        this.posDropdown(true)
      ),
      // List
      h('div',{id:'phoneWordList',className:'scScroll',style:{flex:1,overflowY:'auto',padding:'0 18px'}},
        this.wListBody(80)
      ),
      // Bottom nav
      h('div',{style:{flex:'0 0 auto',display:'flex',borderTop:'1px solid '+C.cardLine,background:C.card,boxShadow:'0 -6px 18px -14px rgba(40,34,22,.45)',paddingBottom:18}},
        [['read','Читать',c=>this.iconRead(c)],['dict','Слова',c=>this.iconWords(c)],['about','О',c=>this.iconInfo(c)]].map(([tab,lbl,icfn])=>{
          const on=tab==='dict', col=on?C.ink:C.muted2;
          return h('button',{key:tab,onClick:()=>on?null:this.showToast('Другие экраны — в основном прототипе'),
            style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'11px 0 4px',background:'none',border:'none',cursor:'pointer'}},
            icfn(col), h('span',{style:{fontFamily:this.sans,fontSize:11,fontWeight:on?700:500,color:col,'aria-label':lbl}},lbl));
        })
      ),
      sheet, this.toastEl(true)
    );
  }

  /* ---- DESKTOP sidebar ---- */
  deskNav() {
    const C=this.C, h=React.createElement;
    return h('div',{style:{width:236,flex:'0 0 auto',background:C.sidebar,borderRight:'1px solid '+C.line,display:'flex',flexDirection:'column',padding:'26px 16px 20px'}},
      h('div',{style:{padding:'0 8px 24px'}},
        h('div',{style:{fontFamily:this.serif,fontSize:20,fontWeight:700,color:C.ink,lineHeight:1.15}},'Читалка НЗ'),
        h('div',{style:{fontFamily:this.sans,fontSize:12,color:C.muted,marginTop:2}},'греческий сквозь русский')
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
        [['read','Читать',c=>this.iconRead(c)],['dict','Слова',c=>this.iconWords(c)],['about','О приложении',c=>this.iconInfo(c)]].map(([tab,lbl,icfn])=>{
          const on=tab==='dict', col=on?C.ink:C.inkSoft;
          return h('button',{key:tab,onClick:()=>on?null:this.showToast('Переключить экран — в основном прототипе'),
            style:{display:'flex',alignItems:'center',gap:12,padding:'11px 12px',borderRadius:11,border:'1px solid '+(on?C.cardLine:'transparent'),cursor:'pointer',background:on?C.card:'transparent',boxShadow:on?C.shadow:'none',textAlign:'left'}},
            icfn(col), h('span',{style:{fontFamily:this.sans,fontSize:14.5,fontWeight:on?700:500,color:col,'aria-label':lbl}},lbl));
        })
      )
    );
  }

  /* ---- DESKTOP main content ---- */
  deskContent() {
    const C=this.C, h=React.createElement, st=this.state;
    const hasActive = !!st.activeKey;

    // Left list panel
    const listPanel = h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',overflow:'hidden'}},
      // Sticky header
      h('div',{style:{flex:'0 0 auto',padding:'20px 28px 14px',borderBottom:'1px solid '+C.line}},
        h('div',{style:{display:'flex',alignItems:'baseline',gap:12,marginBottom:12}},
          h('span',{style:{fontFamily:this.serif,fontSize:25,fontWeight:700,color:C.ink}},'Словарь'),
          h('span',{style:{fontFamily:this.sans,fontSize:13,color:C.muted}},this.getFiltered().length+'\u00a0слов · 1000 самых частотных лемм НЗ')
        ),
        h('div',{style:{marginBottom:11}},this.searchBar(false)),
        h('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
          this.sV3(),
          h('div',{style:{width:1,height:18,background:C.line2}}),
          this.posDropdown(false)
        )
      ),
      // Scrollable list
      h('div',{id:'deskWordList',className:'scScroll',style:{flex:1,overflowY:'auto'}},
        h('div',{style:{maxWidth:640,padding:'0 28px 60px'}},
          this.wListBody(24)
        )
      )
    );

    // Right inspector
    const inspector = h('div',{style:{width:hasActive?316:0,flex:'0 0 auto',borderLeft:hasActive?'1px solid '+C.cardLine:'none',overflow:'hidden',background:C.card,boxShadow:hasActive?'-14px 0 30px -24px rgba(40,34,22,.5)':'none',transition:'width .18s'}},
      hasActive
        ? h('div',{className:'scScroll',style:{width:316,height:'100%',overflowY:'auto'}},this.wCard(st.activeKey))
        : null
    );

    return h('div',{id:'deskMain',style:{flex:1,minWidth:0,display:'flex',position:'relative',overflow:'hidden'}},
      listPanel,
      inspector
    );
  }

  /* ---- DESKTOP app ---- */
  deskApp() {
    const C=this.C, h=React.createElement;
    return h('div',{style:{position:'relative',display:'flex',flexDirection:'column',height:768,background:C.content,color:C.ink}},
      // macOS titlebar
      h('div',{style:{flex:'0 0 auto',height:38,background:C.titlebar,borderBottom:'1px solid '+C.line,display:'flex',alignItems:'center',gap:8,padding:'0 16px'}},
        ['#d98b6e','#dcc06a','#9bbf73'].map((c,i)=>h('span',{key:i,style:{width:11,height:11,borderRadius:'50%',background:c}}))),
      // Body
      h('div',{style:{flex:1,display:'flex',minHeight:0}},
        this.deskNav(),
        this.deskContent()
      ),
      this.toastEl(false)
    );
  }

  /* ---- lifecycle ---- */
  _setupScroll(id) {
    const el = document.getElementById(id);
    if (!el || el._wlOk) return;
    el._wlOk = true;
    el.addEventListener('scroll', () => {
      if (el.scrollTop + el.clientHeight > el.scrollHeight - 180) {
        this.setState(s => ({visibleCount: Math.min(s.visibleCount + 15, this.WORDS.length + 5)}));
      }
    });
  }
  componentDidMount() {
    this._setupScroll('deskWordList');
    this._setupScroll('phoneWordList');
    this._onResize = () => {
      const w = Math.min(1180, (window.innerWidth || 1180) - 40);
      this.setState({deskScale: Math.min(1, w / 1180)});
    };
    this._onResize();
    window.addEventListener('resize', this._onResize);
    this._onDocDown = (e) => {
      if (this.state.posMenuOpen && !(e.target.closest && e.target.closest('[data-posmenu]'))) this.setState({posMenuOpen:false});
      if (this.state.sMenuOpen && !(e.target.closest && e.target.closest('[data-smenu]'))) this.setState({sMenuOpen:false});
    };
    document.addEventListener('mousedown', this._onDocDown);
  }
  componentDidUpdate() {
    this._setupScroll('deskWordList');
    this._setupScroll('phoneWordList');
  }
  componentWillUnmount() {
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._onDocDown) document.removeEventListener('mousedown', this._onDocDown);
  }

  renderVals() {
    this.C = this.palette();
    const s = this.state.deskScale || 1;
    const desktop = React.createElement('div',{style:{width:'100%',height:Math.round(768*s),overflow:'hidden'}},
      React.createElement('div',{style:{width:1180,height:768,transformOrigin:'top left',transform:'scale('+s+')'}},
        this.deskApp()
      )
    );
    return {desktop, phone: this.phoneApp(), posCompare: this.posCompareEl()};
  }
}
</script>

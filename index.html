<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Греческая читалка НЗ</title>
  <!-- FOUC-защита: применить сохранённую тему до загрузки CSS (~0.1ms, синхронный localStorage) -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) {
        var resolved = t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark'
                     : t === 'auto' ? 'light'
                     : t;
        document.documentElement.setAttribute('data-theme', resolved);
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <meta name="theme-color" content="#efeee9">
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Греческая читалка НЗ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FOUC-защита: применить сохранённую тему до загрузки CSS (~0.1ms, синхронный localStorage) -->
  <script>
    (function() {
      var THEMES = ['pergament','sepia','ivory','fog','sea','forest','rose','lavender','sunset','dark','night','coal'];
      var t = localStorage.getItem('theme');
      if (t) {
        var resolved = t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark'
                     : t === 'auto' ? 'pergament'
                     : THEMES.indexOf(t) >= 0 ? t
                     : 'pergament';
        document.documentElement.setAttribute('data-theme', resolved);
      }
      var c = localStorage.getItem('contrast');
      if (c) document.documentElement.setAttribute('data-contrast', c);
    })();
  </script>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <meta name="theme-color" content="#efeee9">
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
  <a href="#main-content" class="skip-to-content">Перейти к содержимому</a>
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
